name: Build uploader.jp Batch Downloader

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  render-readme:
    name: Render README with Jekyll
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main
        uses: actions/checkout@v5

      - name: Prepare Jekyll source
        run: |
          mkdir pages
          cat > pages/_config.yml <<'EOF'
          title: uploader.jp Batch Downloader
          theme: minima
          baseurl: "."
          EOF
          {
            printf '%s\n' \
              '---' \
              'layout: default' \
              '---' \
              '' \
              '<style>.site-header, .site-footer { display: none; }</style>' \
              ''
            cat README.md
          } > pages/index.md
          if [ -d assets ]; then
            cp -R assets pages/assets
          fi

      - name: Build site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages
          destination: ./_site

      - name: Prepare rendered README artifact
        run: |
          mkdir release-site
          cp -R _site/. release-site/
          mv release-site/index.html release-site/README.html
          rm -f release-site/feed.xml
          sed -i 's|="/assets/|="assets/|g' release-site/README.html

      - name: Upload rendered README and assets
        uses: actions/upload-artifact@v7
        with:
          name: rendered-readme
          path: release-site
          if-no-files-found: error

  build:
    needs: render-readme
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            arch_name: windows-x64
          - label: Windows ARM
            os: windows-11-arm
            arch_name: windows-arm64
          - label: macOS Intel
            os: macos-26-intel
            arch_name: macos-x64
          - label: macOS ARM
            os: macos-latest
            arch_name: macos-arm64
          - label: Linux x64
            os: ubuntu-latest
            arch_name: linux-x64
          - label: Linux ARM
            os: ubuntu-24.04-arm
            arch_name: linux-arm64

    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Main
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install Tkinter (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller TkEasyGUI curl-cffi beautifulsoup4

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --clean --windowed --collect-all curl_cffi --collect-all certifi --name UploaderJPBatchDownloader gui.py

      - name: Prepare release files (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Path release-files
          Copy-Item -Recurse dist/UploaderJPBatchDownloader release-files/
          Copy-Item LICENSE release-files/

      - name: Prepare release files (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p release-files
          cp -R dist/UploaderJPBatchDownloader.app release-files/
          cp LICENSE release-files/

      - name: Prepare release files (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-files
          cp -R dist/UploaderJPBatchDownloader release-files/
          cp LICENSE release-files/

      - name: Add rendered README
        uses: actions/download-artifact@v8
        with:
          name: rendered-readme
          path: release-files

      - name: Archive artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          Compress-Archive -Path release-files/* -DestinationPath UploaderJPBatchDownloader-${{ github.ref_name }}-${{ matrix.arch_name }}.zip

      - name: Archive artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          cd release-files && zip -r ../UploaderJPBatchDownloader-${{ github.ref_name }}-${{ matrix.arch_name }}.zip .

      - name: Archive artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          cd release-files && zip -r -y ../UploaderJPBatchDownloader-${{ github.ref_name }}-${{ matrix.arch_name }}.zip .

      - name: Upload zip artifact
        uses: actions/upload-artifact@v7
        with:
          name: UploaderJPBatchDownloader-${{ github.ref_name }}-${{ matrix.arch_name }}
          path: UploaderJPBatchDownloader-${{ github.ref_name }}-${{ matrix.arch_name }}.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create a Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: release-artifacts/*.zip
          draft: true
          generate_release_notes: true
          prerelease: false
